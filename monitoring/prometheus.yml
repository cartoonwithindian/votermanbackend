# CampusVote Prometheus configuration
#
# Scrapes the protected /metrics endpoint on the Render backend and the
# Prometheus process itself. Backed up by the same aggregate-only metrics
# described in ../README.md — no personal data is collected.
#
# Usage:
#   1. Export the same value you set as METRICS_TOKEN on the backend into a
#      secret file:  echo "$METRICS_TOKEN" > /run/secrets/campusvote-metrics-token
#   2. Run: prometheus --config.file=monitoring/prometheus.yml
#   3. Point Grafana at http://localhost:9090 (see monitoring/grafana/).

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # CampusVote backend API (Render free-tier instance).
  - job_name: campusvote-backend-api
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /run/secrets/campusvote-metrics-token
    static_configs:
      - targets:
          - localhost:3000
        labels:
          service: campusvote-api

  # Prometheus self-monitoring (optional).
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090