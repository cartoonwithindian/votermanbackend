services:
  - type: web
    name: votermanbackend
    runtime: node
    plan: free
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voterman-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      # CORS_ORIGIN to be set to https://votermanfrontend.onrender.com in Render dashboard
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        value: admin@dbit.edu,admin@campusvote.edu
      - key: ADMIN_PORTAL_PASSWORD
        sync: false
      # MONGODB_URI to be set to mongodb+srv://voteweb:VoteWeb123!@cluster0.e01dlus.mongodb.net/voteweb in Render dashboard
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: voteweb

databases:
  - name: voterman-db
    plan: free
    databaseName: voteweb
    ipAllowList: []
